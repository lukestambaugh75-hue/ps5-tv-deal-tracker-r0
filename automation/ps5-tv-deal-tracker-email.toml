prompt = """Run the PS5 and TV Deal Tracker refresh, public dashboard verification, and approved email delivery.

Work in `/Users/lukestambaugh/Documents/Files for GitHub/PS5 and TV Deal Tracker r0`.

This automation is explicitly approved to email exactly these two recipients:
- `lukestambaugh75@gmail.com`
- `devin.mullen89@gmail.com`

Do not add CC or BCC. This approval is scoped only to this PS5 and TV tracker.

Audience boundary: this is a standalone direct-link tracker. Do not add a
shared dashboard hub, Ford/Raptor, Kegerator, or other tracker link to the page
or email. The page and email may link only to the PS5/TV dashboard itself and
exact retailer/product URLs in the current `data/deals.json`. Loaded page
assets must be local files under `assets/`.

Required run order:
0. Before any pull or other action, run `/usr/bin/python3 tools/schedule_gate.py` and capture its exit code and output. Continue only on exit 0 plus output containing `SCHEDULE_GATE=RUN`. If the output contains `SCHEDULE_GATE=SKIP`, the exit is nonzero, or malformed output is returned, stop immediately with no pull, browsing, writes, commit, Pages action, or email.
1. Run `git pull --ff-only`.
2. Gather fresh live web or browser-visible evidence for the PS5 target and the 60-70 inch TV target, defaulting to a 65-inch mid-quality 4K smart TV. Prefer big-box retailers and Houston-area pickup/delivery paths. Check Best Buy, Walmart, Target, Costco, Sam's Club, Amazon, GameStop, Sony Direct, Home Depot, and any clearly Houston-area big-box purchase path that appears during the run.
3. Write the fresh evidence packet to `out/browser-price-evidence.json`. Each source row must include `target_id`, `retailer`, `brand`, `model`, `product_name`, `price`, `url`, `stock_status`, `pickup_delivery`, `evidence_class`, `condition`, and `evidence_text`. TV rows must include `size_inches` when known. Valid evidence classes are `houston_visible_buy_path`, `big_box_public_price`, `member_only`, `cart_only`, `manufacturer_direct_reference`, `marketplace_seller`, `open_box_or_refurb`, `out_of_stock`, and `blocked_or_stale`.
4. Do not carry forward prices from memory, prior chat context, or old `data/deals.json` as current prices. If fresh evidence fails, send only a blocker/stale-data warning instead of quoting old prices as current.
5. Run `/usr/bin/python3 tools/refresh_prices_browser.py --evidence out/browser-price-evidence.json`.
6. Run `/usr/bin/python3 tools/render_dashboard.py`.
7. Run `/usr/bin/python3 tools/append_history.py`.
8. Run `/usr/bin/python3 tools/build_email.py --output-dir out`.
9. Run `/usr/bin/python3 tools/audience_guard.py`. Stop without publishing or emailing if it reports any audience-boundary violation.
10. Run `make check`. This is the non-mutating validation gate; do not run `make refresh` or `make verify` again because steps 5-8 already performed each write exactly once.
11. If tracked files changed and the branch is `main`, stage only touched repo files, commit with a clear one-line message, and push to origin. Do not force-push.
12. Run `make pages-check`. If GitHub Pages is not current yet, wait and retry.
13. Run `make public-verify`.
14. Run `/usr/bin/python3 tools/encrypted_dashboard_delivery.py check`, then `/usr/bin/python3 tools/encrypted_dashboard_delivery.py prepare`. Capture only the absolute path printed as `EMAIL_PAYLOAD=`; never print, open, summarize, or commit the bearer link or private payload.
15. Send exactly once with `/usr/bin/python3 "/Users/lukestambaugh/Documents/Files for GitHub/Tools/dashboard-mailer/send_dashboard_email.py" --payload "<EMAIL_PAYLOAD path>" --policy encrypted-link`. The payload must remain exactly Luke and Devin with empty CC/BCC. Do not attach files or inline images and do not use Chrome/Gmail. Never send the legacy `out/latest-email.json` payload.
16. Verify the delivered message with `/usr/bin/python3 "/Users/lukestambaugh/Documents/Files for GitHub/Tools/dashboard-mailer/verify_sent.py" --subject "PS5" --policy encrypted-link`. Only after receipt passes, run `/usr/bin/python3 tools/encrypted_dashboard_delivery.py finalize`. If the send definitively fails before acceptance, run `/usr/bin/python3 tools/encrypted_dashboard_delivery.py abort`. If delivery is ambiguous, do not abort, retry, or create another link; leave pending state intact and reconcile by read-only IMAP search.
17. The encrypted email includes a labeled dashboard preview (best PS5, best 65-inch TV, tracked-offer count, and review flags) only when the current snapshot is Fresh or Due. This is a preview, not a replacement for the encrypted private dashboard.
18. After the email attempt is complete, stop and wait for the next scheduled run.

Do not purchase anything or contact sellers. Confirm final cart total, tax, pickup/delivery timing, and seller identity before buying."""
